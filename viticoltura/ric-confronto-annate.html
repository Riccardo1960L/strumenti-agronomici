<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ric-confronto-annate — Confronto Annate Huglin</title>
<style>
  :root {
    --bg: #0d0f0d;
    --panel: #141714;
    --border: #2a2f2a;
    --text: #d7e0d7;
    --muted: #7f8c7f;
    --accent: #5fd97a;
    --accent-dim: #3a8c4a;
    --warn: #e0c15a;
    --err: #e06a5a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  h1 {
    font-size: 1.25rem;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    background: #0a0c0a;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 10px;
    border-radius: 4px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  datalist {}
  button {
    margin-top: 18px;
    width: 100%;
    background: var(--accent-dim);
    color: #eafff0;
    border: none;
    padding: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  button:hover { background: var(--accent); color: #0a0c0a; }
  button:disabled { opacity: 0.5; cursor: default; }

  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 1.2em;
  }
  #status.err { color: var(--err); }

  #report { display: none; }
  .report-header {
    color: var(--accent);
    font-size: 1rem;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .report-sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 14px;
  }
  hr {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 12px 0;
  }
  .anno-line {
    font-size: 0.92rem;
    margin: 6px 0;
  }
  .anno-line b { color: var(--text); }
  .anno-line .classe { color: var(--muted); }
  .result-box {
    background: #0a0c0a;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    padding: 14px;
    margin-top: 8px;
    text-align: center;
  }
  .result-box .big {
    color: var(--accent);
    font-size: 1.1rem;
  }
  .up { color: var(--warn); }
  .down { color: #6ab7e0; }
  footer {
    margin-top: 30px;
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }
</style>
</head>
<body>

<h1>ric-confronto-annate</h1>
<div class="subtitle">Confronto Annate — Indice di Huglin (15 aprile → 10 settembre)</div>

<div class="panel">
  <div class="grid">
    <div class="field">
      <label for="localita">Località</label>
      <input type="text" id="localita" list="localita-list" value="lavagna">
      <datalist id="localita-list"></datalist>
    </div>
    <div class="field">
      <label for="anno1">Annata 1</label>
      <input type="number" id="anno1" value="2023" min="1950" max="2026">
    </div>
    <div class="field">
      <label for="anno2">Annata 2</label>
      <input type="number" id="anno2" value="2024" min="1950" max="2026">
    </div>
  </div>
  <button id="btn-calcola" onclick="confrontaAnnate()">Confronta annate</button>
  <div id="status"></div>
</div>

<div class="panel" id="report">
  <div class="report-header">CONFRONTO ANNATE – HUGLIN</div>
  <div class="report-sub" id="rep-sub"></div>
  <hr>
  <div class="anno-line" id="rep-anno1"></div>
  <div class="anno-line" id="rep-anno2"></div>
  <div class="result-box">
    <div class="big" id="rep-diff"></div>
  </div>
</div>

<footer>ric-confronto-annate · dati Open-Meteo Archive &amp; Geocoding API</footer>

<script>
// --- Località predefinite (identiche allo script Python originale) ---
const LOCALITA = {
  "lavagna": [44.31, 9.34],
  "vernazza": [44.136, 9.683],
  "albenga": [44.049, 8.218],
  "neive": [44.723, 8.113],
  "montalto pavese": [44.969, 9.248],
  "valdobbiadene": [45.899, 11.999],
  "rivergaro": [44.913, 9.612],
  "pitigliano": [42.633, 11.676],
  "montalcino": [43.056, 11.489],
  "frascati": [41.808, 12.679],
  "benevento": [41.130, 14.780],
  "manduria": [40.402, 17.633],
  "ciro": [39.370, 17.125],
  "marsala": [37.799, 12.437],
  "alghero": [40.557, 8.319]
};

// Ultimo giorno con dati: l'archivio Open-Meteo ha circa 5 giorni di ritardo (uso 7 di margine)
function limiteApi() {
  const d = new Date();
  d.setDate(d.getDate() - 7);
  return d.toISOString().split("T")[0];
}

// Popola il datalist con le località predefinite
(function popolaLista() {
  const dl = document.getElementById('localita-list');
  Object.keys(LOCALITA).forEach(nome => {
    const opt = document.createElement('option');
    opt.value = nome;
    dl.appendChild(opt);
  });
})();

function normalizza(s) {
  return s.trim().toLowerCase();
}

async function geocoding(nome) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nome)}&count=1&language=it`;
  const r = await fetch(url).then(res => res.json());
  if (!r.results || r.results.length === 0) return null;
  const res = r.results[0];
  return { lat: res.latitude, lon: res.longitude, nome: res.name, paese: res.country || "" };
}

async function ottieniCoordinate(loc) {
  const locNorm = normalizza(loc);
  if (LOCALITA[locNorm]) {
    const [lat, lon] = LOCALITA[locNorm];
    return { lat, lon, nomeLoc: locNorm };
  }
  const geo = await geocoding(locNorm);
  if (geo === null) return null;
  return { lat: geo.lat, lon: geo.lon, nomeLoc: `${geo.nome} (${geo.paese})` };
}

async function scaricaDati(startDate, endDate, lat, lon) {
  const lim = limiteApi();
  if (endDate > lim) endDate = lim;
  const url = `https://archive-api.open-meteo.com/v1/archive?` +
    `latitude=${lat}&longitude=${lon}&start_date=${startDate}&end_date=${endDate}` +
    `&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome`;
  const r = await fetch(url).then(res => res.json());
  if (!r.daily) return null;
  return { tmax: r.daily.temperature_2m_max, tmin: r.daily.temperature_2m_min };
}

function calcolaHuglin(tmaxList, tminList, lat) {
  const latAbs = Math.abs(lat);
  let k;
  if (latAbs <= 40.0) k = 1.00;
  else if (latAbs <= 42.0) k = 1.02;
  else if (latAbs <= 44.0) k = 1.03;
  else if (latAbs <= 46.0) k = 1.04;
  else if (latAbs <= 48.0) k = 1.05;
  else k = 1.06;

  let totale = 0.0;
  for (let i = 0; i < tmaxList.length; i++) {
    const mx = tmaxList[i], mn = tminList[i];
    if (mx === null || mn === null || mx === undefined || mn === undefined) continue;
    const tmed = (mx + mn) / 2;
    const h = ((tmed + mx) / 2) - 10;
    if (h > 0) totale += h;
  }
  return { hi: Math.round(totale * k * 100) / 100, k };
}

function classificaHuglin(hi) {
  if (hi < 1500) return "Molto freddo";
  else if (hi < 1800) return "Freddo – Pinot Nero, Chardonnay";
  else if (hi < 2100) return "Temperato – Merlot, Sangiovese fresco";
  else if (hi < 2400) return "Temperato caldo – Cabernet, Nebbiolo";
  else if (hi < 3000) return "Caldo – Primitivo, Nero d'Avola";
  else return "Molto caldo – subtropicale";
}

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

async function confrontaAnnate() {
  const loc = document.getElementById('localita').value;
  const anno1 = parseInt(document.getElementById('anno1').value, 10);
  const anno2 = parseInt(document.getElementById('anno2').value, 10);
  const btn = document.getElementById('btn-calcola');

  document.getElementById('report').style.display = 'none';

  if (!loc || isNaN(anno1) || isNaN(anno2)) {
    setStatus('Compila località e annate.', true);
    return;
  }

  btn.disabled = true;
  setStatus('Ricerca località...');

  try {
    const coords = await ottieniCoordinate(loc);
    if (coords === null) {
      setStatus('❌ Località non trovata.', true);
      btn.disabled = false;
      return;
    }
    const { lat, lon, nomeLoc } = coords;

    const start1 = `${anno1}-04-15`, end1 = `${anno1}-09-10`;
    const start2 = `${anno2}-04-15`, end2 = `${anno2}-09-10`;

    setStatus(`Scarico dati climatici per ${nomeLoc}...`);
    const [d1, d2] = await Promise.all([
      scaricaDati(start1, end1, lat, lon),
      scaricaDati(start2, end2, lat, lon)
    ]);

    if (d1 === null || d2 === null) {
      setStatus('❌ Dati climatici non disponibili.', true);
      btn.disabled = false;
      return;
    }

    const r1 = calcolaHuglin(d1.tmax, d1.tmin, lat);
    const r2 = calcolaHuglin(d2.tmax, d2.tmin, lat);

    const classe1 = classificaHuglin(r1.hi);
    const classe2 = classificaHuglin(r2.hi);

    const diff = r2.hi - r1.hi;
    const perc = r1.hi !== 0 ? (diff / r1.hi) * 100 : 0;

    const prov = [anno1, anno2].filter(a => `${a}-09-10` > limiteApi());
    document.getElementById('rep-sub').textContent =
      `${nomeLoc} · Annate ${anno1} vs ${anno2} · Periodo 15 apr → 10 set` +
      (prov.length ? ` · ⚠ stagione incompleta (${prov.join(', ')}): valore provvisorio` : '');
    document.getElementById('rep-anno1').innerHTML =
      `${anno1} → HI = <b>${r1.hi}</b> <span class="classe">(${classe1})</span>`;
    document.getElementById('rep-anno2').innerHTML =
      `${anno2} → HI = <b>${r2.hi}</b> <span class="classe">(${classe2})</span>`;

    const segno = diff >= 0 ? '+' : '';
    const cls = diff >= 0 ? 'up' : 'down';
    document.getElementById('rep-diff').innerHTML =
      `Differenza: <span class="${cls}">${segno}${diff.toFixed(2)} (${segno}${perc.toFixed(1)}%)</span>`;

    document.getElementById('report').style.display = 'block';
    setStatus('');
  } catch (e) {
    setStatus('❌ Errore durante il recupero dati: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
